name: "ci-bottlenecks"
description: "Find performance problems in GitHub Actions pipelines"
author: "John Carmack"
branding:
  icon: "zap"
  color: "orange"

inputs:
  path:
    description: "Path to the repository root"
    required: false
    default: "."
  audit:
    description: "Enable audit tier (pulls measured data from GitHub API)"
    required: false
    default: "false"
  runs:
    description: "Maximum completed runs to sample per workflow for audit"
    required: false
    default: "25"
  pedantic:
    description: "Enable pedantic rules"
    required: false
    default: "false"
  fail-on:
    description: "Minimum severity to fail the check (high, medium, low, info, none)"
    required: false
    default: "none"
  format:
    description: "Output formats (comma-separated: text, json, sarif, summary)"
    required: false
    default: "text,summary,sarif"
  token:
    description: "GitHub token for API access (audit mode)"
    required: false
    default: ${{ github.token }}

outputs:
  findings:
    description: "Number of findings"
  sarif-path:
    description: "Path to the generated SARIF file"

runs:
  using: "node24"
  main: "dist/index.js"
