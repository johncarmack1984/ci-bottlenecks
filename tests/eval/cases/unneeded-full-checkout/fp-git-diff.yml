# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: git diff needs history to compare against prior commits
# source: change-detection pattern
name: Diff Check
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff HEAD~1 --stat
