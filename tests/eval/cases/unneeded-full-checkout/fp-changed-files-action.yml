# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: tj-actions/changed-files needs git history to determine changed files
# source: changed-files action requires fetch-depth: 0
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: tj-actions/changed-files@v44
        id: changed
