# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: default fetch-depth (1) does not trigger the rule — only fetch-depth 0 does
# source: baseline negative: rule only fires on explicit fetch-depth 0
name: Default Checkout
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
