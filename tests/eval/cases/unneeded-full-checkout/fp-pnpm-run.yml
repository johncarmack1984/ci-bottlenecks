# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: pnpm run invokes an opaque package script that may call git internally
# source: opaque package runner exemption
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pnpm run build
