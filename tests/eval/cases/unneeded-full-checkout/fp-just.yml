# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: just recipes are opaque and may call git internally
# source: conservative allowlist for build tools
name: Just Build
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: just release
