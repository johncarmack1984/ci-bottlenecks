# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: ./scripts/ paths are opaque and may use git history internally
# source: conservative allowlist for local scripts
name: Release Script
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/release.sh
