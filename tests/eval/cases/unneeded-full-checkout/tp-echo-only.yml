# eval: rule=unneeded-full-checkout expect=fire kind=tp
# why: fetch-depth 0 with only an echo step — no plausible need for history
# source: minimal true positive
name: Echo Only
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  greet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: echo hello
