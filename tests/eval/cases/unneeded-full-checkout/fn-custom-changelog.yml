# eval: rule=unneeded-full-checkout expect=silent kind=fn status=xfail
# why: custom changelog action needs history but is not in the allowlist — rule fires incorrectly
# source: third-party changelog generators that read git log internally
name: Custom Changelog
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: some-org/changelog-generator@v3
