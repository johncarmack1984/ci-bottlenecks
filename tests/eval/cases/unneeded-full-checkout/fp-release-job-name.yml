# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: job named "release" likely needs full history for versioning/tagging — release jobs are exempt
# source: theweathernear.me/stormdeck release job pattern
name: Release
on:
  push:
    branches: [main]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm run build
      - run: npx semantic-release
