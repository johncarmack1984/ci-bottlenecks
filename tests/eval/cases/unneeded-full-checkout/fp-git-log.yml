# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: git log needs full history — fetch-depth 0 is justified
# source: changelog generation pattern
name: Changelog
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git log --oneline --since="1 week ago" > CHANGELOG.md
