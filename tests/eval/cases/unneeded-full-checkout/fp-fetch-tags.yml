# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: fetch-tags: true signals explicit intent to use git tags — history is needed
# source: checkout with fetch-tags for calver/semver tag-based workflows
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: npm run build
