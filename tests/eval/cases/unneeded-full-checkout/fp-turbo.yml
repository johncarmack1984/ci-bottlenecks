# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: turbo is an opaque build tool that may use git history for change detection
# source: turborepo change detection requires full history
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: turbo build
