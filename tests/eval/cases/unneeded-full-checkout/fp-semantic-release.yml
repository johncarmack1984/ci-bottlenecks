# eval: rule=unneeded-full-checkout expect=silent kind=fp
# why: semantic-release reads git history for conventional-commit changelog generation
# source: JS/TS release tooling
name: Semantic Release
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx semantic-release
