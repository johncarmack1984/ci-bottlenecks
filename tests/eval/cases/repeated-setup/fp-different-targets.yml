# eval: rule=repeated-setup expect=silent kind=fp
# why: 3 Rust jobs with different --target flags — different cargo flags break the group
# source: rule spec — groups by cargo --target/--features flags
name: Different cargo targets
on: workflow_dispatch
jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --target x86_64-unknown-linux-gnu
      - run: cargo test --target x86_64-unknown-linux-gnu

  build-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --target aarch64-unknown-linux-gnu

  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --target wasm32-unknown-unknown
