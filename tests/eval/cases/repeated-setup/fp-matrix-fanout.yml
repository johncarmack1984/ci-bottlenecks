# eval: rule=repeated-setup expect=silent kind=fp
# why: matrix fan-out is a single YAML job, not separate jobs — only 1 profile in the group
# source: rule spec — groups by job entries, matrix is one entry
name: Matrix fan-out
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        toolchain: [stable, nightly]
        features: [default, async]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo build --features ${{ matrix.features }}
      - run: cargo test --features ${{ matrix.features }}
