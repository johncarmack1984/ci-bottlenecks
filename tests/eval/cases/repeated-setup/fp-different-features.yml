# eval: rule=repeated-setup expect=silent kind=fp
# why: 3 Rust jobs with different --features flags — different cargo flags break the group
# source: rule spec — groups by cargo --target/--features flags
name: Different cargo features
on: workflow_dispatch
jobs:
  test-default:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features default
      - run: cargo test --features default

  test-async:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features async-std
      - run: cargo test --features async-std

  test-tokio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features tokio
      - run: cargo test --features tokio
