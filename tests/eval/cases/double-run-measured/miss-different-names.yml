# eval: rule=double-run-measured expect=silent kind=miss
# why: 2 runs on same SHA but different workflow names form separate groups of size 1
# source: grouping key is name::sha so different names never collide
name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
