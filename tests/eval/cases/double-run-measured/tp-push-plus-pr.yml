# eval: rule=double-run-measured expect=fire kind=tp count=1
# why: push + pull_request on same SHA within 30s is the classic double-trigger
# source: lux node-build.yml production evidence — push and PR events on the same commit
name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
