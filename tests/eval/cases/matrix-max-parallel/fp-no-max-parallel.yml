# eval: rule=matrix-max-parallel expect=silent kind=fp pedantic=true
# why: matrix without max-parallel — rule only fires when max-parallel is explicitly set
# source: rule spec — checks for max-parallel presence
name: Matrix without max-parallel
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
