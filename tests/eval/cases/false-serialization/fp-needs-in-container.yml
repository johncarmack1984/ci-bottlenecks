# eval: rule=false-serialization expect=silent kind=fp
# why: consumer references needs.setup.outputs.image in container.image — genuine data dependency
# source: needs reference in container.image placement
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - id: img
        run: echo "image=ghcr.io/org/test:latest" >> $GITHUB_OUTPUT
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup]
    container:
      image: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
