# eval: rule=false-serialization expect=silent kind=fp
# why: publish_npm is a deploy job despite underscore in name — word boundary regex fails on underscores but token matching should recognize "publish"
# source: Word boundary bug with underscore-separated job IDs
name: Release
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run build
  publish_npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      - run: npm publish
