# eval: rule=false-serialization expect=silent kind=fp
# why: deploy is not a pure CI job — serialization behind test is a valid gate
# source: deploy/publish/release pattern exclusion
name: CI/CD
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: npm run deploy
