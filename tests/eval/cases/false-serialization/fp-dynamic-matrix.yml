# eval: rule=false-serialization expect=silent kind=fp
# why: consumer reads needs.setup.outputs to build its strategy matrix via fromJSON
# source: needs.X.outputs in strategy.matrix detection
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: echo 'matrix={"target":["x86_64","aarch64"]}' >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup]
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --target ${{ matrix.target }}
