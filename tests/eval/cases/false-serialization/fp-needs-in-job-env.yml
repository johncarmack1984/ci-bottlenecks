# eval: rule=false-serialization expect=silent kind=fp
# why: consumer references needs.setup.outputs.version in job-level env — genuine data dependency
# source: needs reference in job-level env: block
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: echo "version=1.0.0" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup]
    env:
      APP_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build
