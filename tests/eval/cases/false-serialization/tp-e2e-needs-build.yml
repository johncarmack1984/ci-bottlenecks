# eval: rule=false-serialization expect=fire kind=tp jobs=e2e
# why: e2e depends on build but does its own checkout and build — no artifact handoff
# source: e2e tests that independently set up everything they need
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test
