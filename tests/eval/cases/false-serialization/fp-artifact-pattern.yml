# eval: rule=false-serialization expect=silent kind=fp
# why: consumer uses download-artifact with pattern that matches producer uploads
# source: artifact pattern matching with merge-multiple
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: target/release/
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
      - run: ./run-integration-tests.sh
