# eval: rule=false-serialization expect=silent kind=fp
# why: consumer aggregates all dependency results with needs.*.result
# source: needs.*.result wildcard detection
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: cargo build
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: cargo test
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, test]
    if: always()
    steps:
      - run: |
          if ${{ contains(needs.*.result, 'failure') }}; then exit 1; fi
