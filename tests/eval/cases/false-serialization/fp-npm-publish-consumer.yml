# eval: rule=false-serialization expect=silent kind=fp
# why: package job runs npm publish — it is a release/deploy consumer, not pure CI
# source: Step-level deploy detection via npm publish command
name: Release
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run build
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm publish
