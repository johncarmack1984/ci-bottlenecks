# eval: rule=no-concurrency expect=silent kind=fp
# why: Manual workflow_dispatch trigger does not benefit from cancel-in-progress
# source: Manually triggered deployment or maintenance workflows
name: Manual Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run deploy
