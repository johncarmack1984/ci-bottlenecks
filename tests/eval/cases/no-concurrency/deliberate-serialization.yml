# eval: rule=no-concurrency expect=silent kind=fp
# why: Explicit cancel-in-progress: false with a concurrency group is a deliberate serialization decision
# source: Deploy workflows that must run sequentially, never canceling in-flight deploys
name: Deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run deploy
