# eval: rule=no-timeout expect=silent kind=fp
# why: Job with timeout-minutes explicitly set should not fire
# source: Properly configured workflow
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
