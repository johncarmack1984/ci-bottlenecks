# eval: rule=no-timeout expect=fire kind=tp
# why: Basic job with no timeout-minutes set should fire
# source: GitHub docs — default job timeout is 6 hours
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test
