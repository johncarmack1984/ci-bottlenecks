# eval: rule=no-timeout expect=fire kind=tp
# why: job with matrix runs-on expression has no timeout-minutes — should fire no-timeout regardless of matrix expansion
# source: cross-cutting case — matrix with runs-on expression
name: Matrix runs-on expression
on: workflow_dispatch
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
