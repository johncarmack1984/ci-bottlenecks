# eval: rule=macos-not-needed expect=fire kind=tp jobs=lint
# why: lint on macOS with a Linux twin running the same tool — lint does not benefit from macOS platform coverage
# source: lint/format jobs that run identically on any platform
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run lint
  lint-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run lint
