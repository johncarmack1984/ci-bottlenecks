# eval: rule=macos-not-needed expect=fire kind=tp
# why: macos-latest with only npm test — no macOS-specific work justifies the 10x cost
# source: common misconfiguration in JS projects
name: NPM Test on macOS
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
