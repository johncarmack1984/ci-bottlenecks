# eval: rule=macos-not-needed expect=silent kind=fp
# why: electron-builder --mac produces macOS binaries
# source: run pattern allowlist
name: Electron Mac Build
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: electron-builder --mac
