# eval: rule=macos-not-needed expect=fire kind=tp jobs=docs
# why: docs job on macOS with a Linux twin — documentation generation has no platform dependency
# source: doc generation jobs that waste macOS minutes
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run docs
  docs-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run docs
