# eval: rule=macos-not-needed expect=silent kind=fp
# why: matrix including macos-latest in os values signals intentional cross-platform testing
# source: strategy.matrix serialization check
name: Cross Platform
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - run: npm test
