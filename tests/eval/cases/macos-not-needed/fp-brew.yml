# eval: rule=macos-not-needed expect=silent kind=fp
# why: brew is macOS-specific — its presence justifies the runner choice
# source: macOS command allowlist
name: Brew Install
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install protobuf
      - run: cargo build
