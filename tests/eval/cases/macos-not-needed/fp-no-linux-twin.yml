# eval: rule=macos-not-needed expect=silent kind=fp
# why: no other job runs on Linux — macOS is the project's platform, not extra coverage
# source: macOS-only project where macOS is the deliberate platform choice
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
