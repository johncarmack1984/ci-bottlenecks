# eval: rule=macos-not-needed expect=fire kind=tp jobs=fmt
# why: fmt on macOS with a Linux twin — cargo fmt produces identical results on any platform
# source: format check jobs that waste macOS minutes
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fmt:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
  fmt-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
