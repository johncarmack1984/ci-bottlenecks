# eval: rule=macos-not-needed expect=silent kind=fp
# why: test-linux on ubuntu + test-mac on macOS both running cargo test — this is legitimate platform coverage, not waste
# source: cross-platform test matrix pattern
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
  test-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
