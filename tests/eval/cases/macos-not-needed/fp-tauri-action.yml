# eval: rule=macos-not-needed expect=silent kind=fp
# why: tauri-action builds native desktop apps — macOS runner needed for .app/.dmg output
# source: action pattern allowlist
name: Tauri Build
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
