# eval: rule=macos-not-needed expect=silent kind=fp
# why: flutter build macos produces a macOS desktop app
# source: run pattern allowlist
name: Flutter macOS
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: flutter build macos
