# eval: rule=macos-not-needed expect=silent kind=fp
# why: job id "test-macos" signals intentional macOS targeting even without macOS commands
# source: job id/name keyword allowlist
name: macOS Test
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
