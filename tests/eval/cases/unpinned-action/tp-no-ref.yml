# source: rule spec — empty version is treated as mutable
name: Action with no ref
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: some-org/some-action
      - run: echo done
