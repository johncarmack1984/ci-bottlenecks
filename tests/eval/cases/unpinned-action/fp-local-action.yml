# eval: rule=unpinned-action expect=silent kind=fp
# why: local actions (starting with ./) are always safe — isLocal flag skips them
# source: rule spec — local actions excluded
name: Local action
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/my-action
      - run: echo done
