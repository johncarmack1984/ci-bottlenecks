# eval: rule=flaky-or-hanging expect=silent kind=fp
# why: cancelled jobs from cancel-in-progress runs (run.conclusion=cancelled) should not count as real cancellations
# source: cancel-in-progress filtering -- run-level cancelled excludes job from real-cancelled count
name: CI
on: [push]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
