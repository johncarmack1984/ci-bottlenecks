# eval: rule=flaky-or-hanging expect=silent kind=miss
# why: p95 is ~2.5x median (below 3x threshold) -- borderline but rule correctly stays silent
# source: edge case where variance is elevated but not enough to trigger
name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
