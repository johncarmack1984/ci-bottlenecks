# eval: rule=no-path-filter expect=silent kind=fp pedantic=true
# why: workflow has paths-ignore on push trigger — treated the same as paths
# source: rule spec — paths-ignore counts as a path filter
name: Has paths-ignore
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
