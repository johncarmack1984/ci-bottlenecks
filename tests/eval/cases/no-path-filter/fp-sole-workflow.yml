# eval: rule=no-path-filter expect=silent kind=fp pedantic=true
# why: workflow_dispatch trigger does not trigger no-path-filter (rule requires push or pull_request). Tests that non-push/PR workflows are silent regardless of companions in the directory.
# source: rule spec — only push/pull_request triggers are checked
name: Sole workflow
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run deploy
