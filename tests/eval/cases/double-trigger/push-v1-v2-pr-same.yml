# eval: rule=double-trigger expect=silent kind=fp
# why: push restricted to literal version branches (v1, v2) — long-lived branches, not PR heads
# source: plugins-workspace CI pattern — push: [v1, v2] + pull_request: [v1, v2]
name: CI
on:
  push:
    branches: [v1, v2]
  pull_request:
    branches: [v1, v2]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
