# eval: rule=double-trigger expect=silent kind=fp
# why: Push restricted to main only is the standard pattern — default branch exemption applies
# source: GitHub docs recommended CI pattern
name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
