# eval: rule=double-trigger expect=silent kind=fp
# why: push.branches filters HEAD refs, pull_request.branches filters BASE refs — push: [develop] only fires on direct pushes to develop, PR: [main] only fires on PRs targeting main. Cross-branch PRs (develop->main) are a rare long-lived-to-long-lived case, not a typical double trigger.
# source: Real-world pattern where push and PR branch filters refer to different ref types
name: CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
