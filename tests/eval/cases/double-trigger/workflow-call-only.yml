# eval: rule=double-trigger expect=silent kind=fp
# why: workflow_call trigger is for reusable workflows — not push/PR, so no double-trigger possible
# source: cross-cutting shape — workflow_call workflows
name: Reusable CI
on:
  workflow_call:
    inputs:
      ref:
        type: string
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: npm test
