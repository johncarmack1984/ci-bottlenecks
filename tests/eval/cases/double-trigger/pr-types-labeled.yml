# eval: rule=double-trigger expect=silent kind=fp
# why: PR types restricted to 'labeled' excludes synchronize and opened, so no push-overlap risk
# source: Label-driven workflows that react to labeling events, not code pushes
name: Label Check
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [labeled]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: echo "Label check"
