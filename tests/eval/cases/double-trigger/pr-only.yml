# eval: rule=double-trigger expect=silent kind=fp
# why: Only pull_request trigger present, no push means no double trigger possible
# source: PR-only CI workflows
name: PR Check
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
