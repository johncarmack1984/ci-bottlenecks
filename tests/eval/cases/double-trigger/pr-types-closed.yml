# eval: rule=double-trigger expect=silent kind=fp
# why: PR types restricted to 'closed' excludes synchronize and opened, so no push-overlap risk
# source: PR merge/close handler workflows
name: Cleanup
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [closed]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: echo "Post-close cleanup"
