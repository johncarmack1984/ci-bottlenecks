# eval: rule=double-trigger expect=fire kind=tp
# why: Explicit object syntax with push and pull_request both null (unfiltered) still causes full branch overlap
# source: Equivalent to array form but tests parser handling of null trigger values
name: CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
