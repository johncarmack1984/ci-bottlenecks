# eval: rule=double-trigger expect=fire kind=tp
# why: Push includes non-default branch 'develop' which appears in both push and PR branch filters
# source: Multi-branch workflow where develop is not exempted as a default branch
name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
