# eval: rule=double-trigger expect=silent kind=fp
# why: push.branches and pull_request.branches are different namespaces — push filters HEAD refs, PR filters BASE refs. All branches here are literal long-lived names, not PR head branches.
# source: Multi-branch workflow where push and PR list overlapping literal branch names
name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm test
