# eval: rule=double-trigger expect=silent kind=fp
# why: Only push trigger present, no pull_request means no double trigger possible
# source: Deploy-on-push workflows
name: Deploy
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run deploy
