# eval: rule=double-trigger expect=silent kind=fp
# why: Push with only tags filter (no branches key) cannot overlap with PR branch triggers
# source: Release workflow pattern — push triggers on version tags, PR triggers on branches
name: Release
on:
  push:
    tags: ['v*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run build
