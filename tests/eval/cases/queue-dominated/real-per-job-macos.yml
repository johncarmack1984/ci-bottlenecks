# eval: rule=queue-dominated expect=fire kind=tp count=1
# why: macOS runner has significant per-job queue time (3min queue for 2min job)
name: Build
on: push
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift build
