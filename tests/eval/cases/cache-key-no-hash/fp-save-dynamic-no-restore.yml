# eval: rule=cache-key-no-hash expect=silent kind=fp
# why: actions/cache/save with dynamic key and no restore-keys should not fire — save has no restore-keys input
# source: rule spec — save is excluded from the restore-keys check
name: Cache save with dynamic key
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: actions/cache/save@v4
        with:
          key: build-${{ hashFiles('**/package-lock.json') }}
          path: dist/
