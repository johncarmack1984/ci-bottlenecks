# eval: rule=cache-key-no-hash expect=fire kind=tp count=1
# why: actions/cache with a dynamic key (hashFiles) but no restore-keys should fire low
# source: rule spec — missing restore-keys fallback detection
name: Dynamic key without restore-keys
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          key: deps-${{ hashFiles('**/package-lock.json') }}
          path: node_modules
      - run: npm ci
