# eval: rule=cache-key-no-hash expect=fire kind=tp count=1
# why: actions/cache/save with a static key still fires high — the static-key check applies to all action types
# source: rule spec — static key on save is still a problem
name: Cache save with static key
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: actions/cache/save@v4
        with:
          key: build-output
          path: dist/
