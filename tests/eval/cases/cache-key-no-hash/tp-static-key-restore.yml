# eval: rule=cache-key-no-hash expect=fire kind=tp count=1
# why: actions/cache/restore with a static key should fire high just like actions/cache
# source: rule spec — restore variant also checked for static keys
name: Static restore key
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          key: rust-deps
          path: ~/.cargo
      - run: cargo build
