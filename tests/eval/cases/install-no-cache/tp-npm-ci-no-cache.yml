# eval: rule=install-no-cache expect=fire kind=tp count=1
# why: npm ci without any cache mechanism should fire
# source: rule spec — uncached Node.js install
name: npm ci without cache
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
