# eval: rule=install-no-cache expect=silent kind=fp pedantic=true
# why: actions/cache with an expression-based path (${{ env.STORE_PATH }}) is opaque — the rule treats it as potentially caching anything, so pnpm install is considered covered (unmeasured detection: pedantic-only info trace)
# source: rule spec — expression paths treated as caching all ecosystems
name: pnpm install with expression cache path
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install
      - run: pnpm test
