# eval: rule=install-no-cache expect=silent kind=fp
# why: Local composite actions are opaque — the rule assumes they handle caching for all ecosystems
# source: rule spec — local composite actions treated as cached for all ecosystems
name: npm ci with local composite action
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npm test
