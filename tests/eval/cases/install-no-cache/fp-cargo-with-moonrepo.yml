# eval: rule=install-no-cache expect=silent kind=fp
# why: moonrepo/setup-rust caches by default (unless cache: false) — cargo build is covered
# source: rule spec — moonrepo/setup-rust is a recognized cache provider for Rust
name: cargo build with moonrepo/setup-rust
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-rust@v1
      - run: cargo build
      - run: cargo test
