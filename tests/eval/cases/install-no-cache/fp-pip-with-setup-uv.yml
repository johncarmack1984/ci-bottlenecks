# eval: rule=install-no-cache expect=silent kind=fp
# why: astral-sh/setup-uv provides Python dependency caching — pip install is covered
# source: rule spec — setup-uv is a recognized cache provider for Python
name: pip install with setup-uv
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: pip install -r requirements.txt
      - run: pytest
