# eval: rule=install-no-cache expect=fire kind=tp count=1 pedantic=true
# why: oven-sh/setup-bun only caches the bun binary, not dependency installs — bun install still needs a separate cache mechanism (unmeasured detection: pedantic-only info trace)
# source: rule spec — setup-bun is NOT a dependency cache provider
name: bun install with setup-bun only
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
