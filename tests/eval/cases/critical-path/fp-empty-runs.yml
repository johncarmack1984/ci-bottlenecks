# eval: rule=critical-path expect=silent kind=fp
# why: empty runs array triggers early return before any DAG computation
# source: edge case — no completed runs in the audit sample
name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo build
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - run: cargo test
