# eval: rule=critical-path expect=fire kind=tp count=1
# why: matrix legs appear as "test (ubuntu-latest)" in the API — the rule should match them by prefix
# source: matrix leg matching pattern — common in multi-OS CI workflows
name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: cargo build
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [build]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - run: cargo test
