name: Problematic
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm ci
      - uses: actions/cache@v4
        with:
          key: my-cache
          path: node_modules
  lint:
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@main
      - run: npm test
